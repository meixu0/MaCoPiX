name: Build macOS DMG

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build-macos:
    runs-on: macos-14 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies via Homebrew
      run: |
        brew update
        brew install automake autoconf libtool pkg-config
        brew install gtk+3 gtk-mac-integration pango cairo harfbuzz librsvg
        brew install dylibbundler create-dmg

    - name: Build Binary
      run: |
        chmod +x makeosx.sh
        ./makeosx.sh

    - name: Package App Bundle & Wrapper Script
      run: |
        APP_DIR="MaCoPiX.app"
        
        mkdir -p "$APP_DIR/Contents/MacOS"
        mkdir -p "$APP_DIR/Contents/Resources/share/glib-2.0/schemas"
        mkdir -p "$APP_DIR/Contents/Resources/lib/gdk-pixbuf-2.0/2.10.0/loaders"
        mkdir -p "$APP_DIR/Contents/Resources/share/icons"
        
        cp src/macopix "$APP_DIR/Contents/MacOS/macopix-bin"
        
        cp /opt/homebrew/share/glib-2.0/schemas/gschemas.compiled "$APP_DIR/Contents/Resources/share/glib-2.0/schemas/"
        cp /opt/homebrew/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.so "$APP_DIR/Contents/Resources/lib/gdk-pixbuf-2.0/2.10.0/loaders/"
        
        cp -r /opt/homebrew/share/icons/hicolor "$APP_DIR/Contents/Resources/share/icons/" || true
        cp -r /opt/homebrew/share/icons/Adwaita "$APP_DIR/Contents/Resources/share/icons/" || true
        
        cat /opt/homebrew/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache | sed 's|/opt/homebrew/lib/gdk-pixbuf-2.0/2.10.0/loaders/||g' > "$APP_DIR/Contents/Resources/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
        
        cat << 'EOF' > "$APP_DIR/Contents/MacOS/macopix"
        #!/bin/bash
        DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
        
        export GSETTINGS_SCHEMA_DIR="$DIR/../Resources/share/glib-2.0/schemas"
        export XDG_DATA_DIRS="$DIR/../Resources/share"
        export GDK_PIXBUF_MODULEDIR="$DIR/../Resources/lib/gdk-pixbuf-2.0/2.10.0/loaders"
        
        export GDK_PIXBUF_MODULE_FILE="$DIR/../Resources/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
        export GIO_MODULE_DIR="$DIR/../Resources/lib/gio/modules"
        export GTK_PATH="$DIR/../Resources"
        export GTK_IM_MODULE_FILE="$DIR/../Resources/etc/gtk-3.0/gtk.immodules"
        
        exec "$DIR/macopix-bin" "$@"
        EOF
        
        chmod +x "$APP_DIR/Contents/MacOS/macopix"
        
        cat << 'EOF' > "$APP_DIR/Contents/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key><string>macopix</string>
            <key>CFBundleIdentifier</key><string>com.github.macopix</string>
            <key>CFBundleName</key><string>MaCoPiX</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
        </dict>
        </plist>
        EOF

    - name: Bundle ALL Dynamic Libraries
      run: |
        APP_DIR="MaCoPiX.app"
        SEARCH_PATHS="-s /opt/homebrew/lib -s /opt/homebrew/Cellar -s /opt/homebrew/opt"
        
        mkdir -p "$APP_DIR/Contents/libs"
        
        dylibbundler -of -b -x "$APP_DIR/Contents/MacOS/macopix-bin" -d "$APP_DIR/Contents/libs/" $SEARCH_PATHS
        
        find /opt/homebrew -name "libgtkmacintegration-gtk3*.dylib" -exec cp -L {} "$APP_DIR/Contents/libs/" \;
        find "$APP_DIR/Contents/libs" -name "libgtkmacintegration-gtk3*.dylib" -exec dylibbundler -of -b -x {} -d "$APP_DIR/Contents/libs/" $SEARCH_PATHS \;
        
        for loader in "$APP_DIR/Contents/Resources/lib/gdk-pixbuf-2.0/2.10.0/loaders/"*.so; do
          dylibbundler -of -b -x "$loader" -d "$APP_DIR/Contents/libs/" $SEARCH_PATHS
        done

    - name: Create DMG
      run: |
        create-dmg \
          --volname "MaCoPiX" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --app-drop-link 400 150 \
          "MaCoPiX.dmg" \
          "MaCoPiX.app"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaCoPiX-macOS-ARM64
        path: MaCoPiX.dmg